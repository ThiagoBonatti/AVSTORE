<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AVSTORE - Loja Online</title>
<link rel="icon" type="image/png" href="/img/favicon-32.png" />
<link rel="apple-touch-icon" href="/img/favicon-180.png" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="logo"><img src="/img/logo.png" alt="AVSTORE" class="logo-img" /></a>
      <button id="cart-toggle" class="icon-btn cart-toggle" aria-label="Ver carrinho de compras">
        🛒
        <span id="cart-count" class="cart-badge" hidden>0</span>
      </button>
    </div>
  </header>

  <main class="container">
    <section class="filters-bar" aria-label="Filtros de produtos">
      <div class="filter-group">
        <label for="filter-category">Categoria</label>
        <select id="filter-category">
          <option value="">Todas</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="filter-color">Cor</label>
        <select id="filter-color">
          <option value="">Todas</option>
        </select>
      </div>
      <div class="filter-group filter-search">
        <label for="filter-search">Buscar</label>
        <input id="filter-search" type="search" placeholder="Buscar por nome ou codigo..." />
      </div>
    </section>

    <section id="product-grid" class="product-grid" aria-live="polite"></section>

    <p id="empty-state" class="empty-state" hidden>Nenhum produto encontrado com esses filtros.</p>
    <p id="loading-state" class="loading-state" hidden>Carregando produtos...</p>

    <div id="sentinel" class="sentinel" aria-hidden="true"></div>
  </main>

  <!-- Modal de detalhe do produto -->
  <div id="product-modal" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <button id="modal-close" class="icon-btn modal-close" aria-label="Fechar">✕</button>
      <div id="modal-content" class="modal-content"></div>
    </div>
  </div>

  <!-- Modal do carrinho de compras -->
  <div id="cart-modal" class="modal-overlay" hidden>
    <div class="modal cart-modal-inner" role="dialog" aria-modal="true" aria-label="Carrinho de compras">
      <button id="cart-modal-close" class="icon-btn modal-close" aria-label="Fechar">✕</button>
      <h2 class="cart-title">Meu carrinho</h2>

      <div id="cart-items" class="cart-items"></div>
      <p id="cart-empty-state" class="empty-state" hidden>Seu carrinho esta vazio.</p>

      <div id="cart-summary" class="cart-summary" hidden>
        <div class="cart-total-row">
          <span>Total</span>
          <strong id="cart-total-value"></strong>
        </div>
        <button id="cart-checkout" class="btn btn-primary btn-block">Finalizar pedido pelo WhatsApp</button>
        <button id="cart-clear" class="btn btn-ghost btn-block">Esvaziar carrinho</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span id="year"></span> AVSTORE. Todos os direitos reservados.</p>
      <a href="/admin/login.html" class="admin-link">Area administrativa</a>
    </div>
  </footer>

  <script src="/js/cart.js"></script>
  <script src="/js/store.js"></script>
</body>
</html>
