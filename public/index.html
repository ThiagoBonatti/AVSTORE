<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AVSTORE - Loja Online</title>
<link rel="icon" type="image/png" href="/img/favicon-32.png" />
<link rel="apple-touch-icon" href="/img/favicon-180.png" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="logo"><img src="/img/logo.png" alt="AVSTORE" class="logo-img" /></a>
    </div>
  </header>

  <main class="container">
    <section class="filters-bar" aria-label="Filtros de produtos">
      <div class="filter-group">
        <label for="filter-category">Categoria</label>
        <select id="filter-category">
          <option value="">Todas</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="filter-color">Cor</label>
        <select id="filter-color">
          <option value="">Todas</option>
        </select>
      </div>
      <div class="filter-group filter-search">
        <label for="filter-search">Buscar</label>
        <input id="filter-search" type="search" placeholder="Buscar por nome ou codigo..." />
      </div>
    </section>

    <section id="product-grid" class="product-grid" aria-live="polite"></section>

    <p id="empty-state" class="empty-state" hidden>Nenhum produto encontrado com esses filtros.</p>
    <p id="loading-state" class="loading-state" hidden>Carregando produtos...</p>

    <div id="sentinel" class="sentinel" aria-hidden="true"></div>
  </main>

  <!-- Modal de detalhe do produto -->
  <div id="product-modal" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <button id="modal-close" class="icon-btn modal-close" aria-label="Fechar">✕</button>
      <div id="modal-content" class="modal-content"></div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span id="year"></span> AVSTORE. Todos os direitos reservados.</p>
      <a href="/admin/login.html" class="admin-link">Area administrativa</a>
    </div>
  </footer>

  <script src="/js/store.js"></script>
</body>
</html>
