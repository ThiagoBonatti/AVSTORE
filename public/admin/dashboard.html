<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AVSTORE Admin - Painel</title>
<link rel="stylesheet" href="/admin/css/admin.css" />
</head>
<body>
  <header class="admin-header">
    <div class="admin-logo">AV<span>STORE</span> Admin</div>
    <div class="admin-header-actions">
      <span class="admin-username" id="admin-username"></span>
      <a href="/" class="btn btn-ghost btn-sm">Ver loja</a>
      <button id="logout-btn" class="btn btn-ghost btn-sm">Sair</button>
    </div>
  </header>

  <main class="admin-main">
    <section class="admin-card">
      <h2 id="form-title">Cadastrar novo produto</h2>
      <form id="product-form" class="product-form" enctype="multipart/form-data">
        <label class="full">
          Codigo (identificador unico) <span id="code-locked-hint"></span>
          <input type="text" id="code" name="code" required />
        </label>

        <label class="full">
          Descricao
          <input type="text" id="description" name="description" required />
        </label>

        <label>
          Categoria
          <input type="text" id="category" name="category" list="category-list" required />
          <datalist id="category-list"></datalist>
        </label>

        <label>
          Cor
          <input type="text" id="color" name="color" list="color-list" required />
          <datalist id="color-list"></datalist>
        </label>

        <label>
          Tamanho
          <input type="text" id="size" name="size" required />
        </label>

        <label>
          Preco (R$)
          <input type="number" id="price" name="price" min="0" step="0.01" required />
        </label>

        <label class="full">
          Imagem <span id="image-required-hint">(obrigatoria)</span>
          <input type="file" id="image" name="image" accept="image/png,image/jpeg,image/webp,image/gif" />
          <img id="image-preview" class="image-preview" alt="Previa da imagem" />
        </label>

        <p id="form-message" class="form-message" hidden></p>

        <div class="form-actions">
          <button type="submit" id="submit-btn" class="btn btn-primary">Cadastrar produto</button>
          <button type="button" id="cancel-edit-btn" class="btn btn-ghost" hidden>Cancelar edicao</button>
        </div>
      </form>
    </section>

    <section class="admin-card">
      <h2>Produtos cadastrados (<span id="product-count">0</span>)</h2>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Imagem</th>
              <th>Codigo</th>
              <th>Descricao</th>
              <th>Categoria</th>
              <th>Cor</th>
              <th>Tamanho</th>
              <th>Preco</th>
              <th>Criado em</th>
              <th>Acoes</th>
            </tr>
          </thead>
          <tbody id="product-table-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script type="module" src="/admin/js/admin.js"></script>
</body>
</html>
